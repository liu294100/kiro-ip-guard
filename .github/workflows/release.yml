name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - id: version
        shell: bash
        run: |
          version="$(python -c 'from ip_guard import __version__; print(__version__)')"
          tag="${GITHUB_REF_NAME:-v$version}"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match ip_guard.__version__ ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # - name: Run tests
      #   run: python -m unittest discover -s tests -v
      - name: Build release archives
        shell: cmd
        run: release.bat ${{ needs.validate.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release/*.zip
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip
      # - name: Run tests
      #   run: python -m pip install -r requirements.txt && python -m unittest discover -s tests -v
      - name: Build release archives
        run: chmod +x release.sh scripts/macos/*.sh && ./release.sh "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: [validate, windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          awk -v heading="## $TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section for $TAG; using generated notes only." >&2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.validate.outputs.tag }}" release-assets/* --repo "${{ github.repository }}" --notes-file release-notes.md --generate-notes --verify-tag
